<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Workspace Login</title>
    <style>
        /* Базовые стили и текстурированный светло-серый фон */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            /* Мелкая сетка паттерна */
            background-image:
                linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: "Open Sans", Tahoma, Arial, sans-serif;
            font-size: 13px;
        }

        /* Чистая монолитная карточка входа как на скриншоте */
        .login-card {
            width: 320px;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            border: 1px solid #d9d9d9;
            padding: 25px 25px 22px 25px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* Красный текст ошибки */
        .error-message {
            color: #cc0000;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: left;
            display: none; /* Скрыто по умолчанию */
        }

        /* Поля ввода с легким оттенком фона */
        .form-input {
            width: 100%;
            height: 32px;
            padding: 0 10px;
            margin-bottom: 12px;
            border: 1px solid #a5bccc;
            background-color: #ebf3f9; /* Серо-синий бэкграунд инпутов как на скрине */
            border-radius: 3px;
            font-size: 13px;
            font-family: inherit;
            color: #333333;
            box-sizing: border-box;
            outline: none;
            transition: all 0.15s ease;
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: #0093dd;
            box-shadow: 0 0 4px rgba(0, 147, 221, 0.2);
        }

        /* Плоская матовая синяя кнопка */
        .btn-login {
            width: 100%;
            height: 36px;
            background-color: #179cd8;
            border: 1px solid #1387bc;
            border-radius: 3px;
            color: #ffffff;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
            outline: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: background-color 0.1s ease;
        }

        .btn-login:hover {
            background-color: #1ba7e7;
        }

        .btn-login:active {
            background-color: #1282b5;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <!-- Карточка клиентской авторизации -->
    <div class="login-card">
        <!-- Текст ошибки в точности как на скрине -->
        <div id="err-block" class="error-message">Incorrect username or password</div>

        <input type="text" id="username" class="form-input" placeholder="Username" autocomplete="username">
        <input type="password" id="password" class="form-input" placeholder="Password" autocomplete="current-password">

        <button id="subBtn" class="btn-login">Login</button>
    </div>

    <!-- Клиентский скрипт отправки данных -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const errBlock = document.getElementById("err-block");
            const btn = document.getElementById("subBtn");
            const userInput = document.getElementById("username");
            const passInput = document.getElementById("password");

            const performLogin = async () => {
                errBlock.style.display = "none";

                const login = userInput.value.trim();
                const password = passInput.value.trim();

                if (!login || !password) {
                    errBlock.innerText = "Please fill in all fields";
                    errBlock.style.display = "block";
                    return;
                }

                try {
                    const res = await fetch("/api/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ login, password })
                    });
                    const data = await res.json();

                    if (data.success) {
                        // Переход на базовый корень клиента
                        window.location.href = "/";
                    } else {
                        errBlock.innerText = "Incorrect username or password";
                        errBlock.style.display = "block";
                    }
                } catch (err) {
                    errBlock.innerText = "Network error, please try again";
                    errBlock.style.display = "block";
                }
            };

            btn.addEventListener("click", performLogin);

            [userInput, passInput].forEach(input => {
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") performLogin();
                });
            });
        });
    </script>
</body>
</html>
